<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>StudentHub - Notes</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav>
    <a href="/">Home</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/planner">Planner</a>
    <a href="/notes">Notes</a>
    <a href="/expenses">Expenses</a>
    <a href="/about">About</a>
</nav>

<div class="container">

    <h1>📝 Notes</h1>
    <form method="GET" action="/notes">

    <input
        type="text"
        name="search"
        placeholder="🔍 Search notes..."
        value="{{ search }}"
    >

    <button type="submit">
        Search
    </button>

</form>

    <p>Create, edit and manage your notes.</p>


    <!-- ADD NOTE -->

    <div class="card">

        <h2>➕ Add New Note</h2>

        <form method="POST" action="/notes">

            <input
                type="text"
                name="title"
                placeholder="Note title"
                required
            >

            <textarea
                name="content"
                placeholder="Write your note..."
                rows="6"
                required
            ></textarea>

            <button type="submit">
                Add Note
            </button>

        </form>

    </div>


    <!-- NOTES LIST -->

    <div class="card">

        <h2>📚 Your Notes</h2>

        {% if notes %}

            {% for note in notes %}

                <div class="note">

                    <h3>{{ note[1] }}</h3>

                    <p>{{ note[2] }}</p>


                    <!-- EDIT -->

                    <a href="/edit_note/{{ note[0] }}">
                        <button type="button">
                            ✏️ Edit
                        </button>
                    </a>


                    <!-- DELETE -->

                    <a href="/delete_note/{{ note[0] }}">
                        <button type="button">
                            🗑️ Delete
                        </button>
                    </a>

                </div>

                <hr>

            {% endfor %}

        {% else %}

            <p>
                No notes yet. Create your first note above.
            </p>

        {% endif %}

    </div>

</div>

</body>

</html>
