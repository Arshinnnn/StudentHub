<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Note</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav>
    <a href="/">Home</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/planner">Planner</a>
    <a href="/notes">Notes</a>
    <a href="/expenses">Expenses</a>
    <a href="/about">About</a>
</nav>

<div class="container">

    <h1>✏️ Edit Note</h1>

    <form method="POST">

        <input
            type="text"
            name="title"
            value="{{ note[1] }}"
            required
        >

        <br><br>

        <textarea
            name="content"
            rows="8"
            required
        >{{ note[2] }}</textarea>

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="/notes">← Back to Notes</a>

</div>

</body>
</html>
