<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>StudentHub - Expenses</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav>
    <a href="/">Home</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/planner">Planner</a>
    <a href="/notes">Notes</a>
    <a href="/expenses">Expenses</a>
    <a href="/about">About</a>
</nav>

<div class="container">

    <h1>💰 Expense Tracker</h1>

    <form method="POST" action="/expenses">

        <input
            type="text"
            name="title"
            placeholder="Expense name"
            required
        >

        <input
            type="number"
            name="amount"
            step="0.01"
            placeholder="Amount"
            required
        >

        <button type="submit">
            Add Expense
        </button>

    </form>

    <hr>

    <h2>Total: ₹{{ "%.2f"|format(total_expenses) }}</h2>

    <h2>Expenses</h2>

    {% for expense in expenses %}

        <div class="card">

            <h3>{{ expense[1] }}</h3>

            <p>₹{{ "%.2f"|format(expense[2]) }}</p>

        </div>

    {% else %}

        <p>No expenses yet.</p>

    {% endfor %}

</div>

</body>
</html>
